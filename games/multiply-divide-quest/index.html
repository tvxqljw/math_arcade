25}deg;--distance:${120+rand(200)}px;--hue:${rand(360)}"></i>`).join('');el.classList.add('show');celebrationTimer=setTimeout(()=>el.classList.remove('show'),1050)}function setFeedback(t,good){feedback=t;feedbackType=good?'good':'bad';$('feedback').textContent=t;$('feedback').className='feedback '+feedbackType}function celebrate(){beep('win');let d=document.createElement('div');d.className='confetti';for(let i=0;i<65;i++){let s=document.createElement('span');s.style.left=rand(100)+'%';s.style.background=pick(['#f96d85','#ffce51','#5485ec','#40c995']);s.style.animationDelay=(Math.random()*.7)+'s';d.append(s)}document.body.append(d);setTimeout(()=>d.remove(),3200)}function button(s,action,value,cls=''){return `<button class="tile ${cls}" data-action="${action}" data-value="${value}">${s}</button>`}function grid(items,cols=4){return `<div class="options ${cols===3?'three':cols===2?'two':''}">${items.join('')}</div>`}function newRound(){round++;locked=false;win=false;feedback='';if(game===0){let a=eq(),b=eq();if(rand(4)===0){let k=1+rand(level==='L2'?10:12);if(level==='L2'){let x=1+rand(10),y=1+rand(10);a={s:`${x} × ${y}`,v:x*y};b={s:`${x*y} ÷ 1`,v:x*y}}else b={s:`${a.v*k} ÷ ${k}`,v:a.v}}data={a,b,answer:a.v>b.v?'>':a.v<b.v?'<':'=',selected:null,selectedGood:null}}if(game===1){let max=level==='L2'?10:12,a=1+rand(max),b=1+rand(max),div=op==='div'||op==='mix'&&rand(2)===0,slot=rand(div?3:2);let vals=div?[a*b,a,b]:[a,b,a*b];data={selected:null,selectedGood:null,s:div?`${slot===0?'□':vals[0]} ÷ ${slot===1?'□':vals[1]} = ${slot===2?'□':vals[2]}`:`${slot===0?'□':a} × ${slot===1?'□':b} = ${a*b}`,answer:vals[slot],opts:choices(vals[slot])}}if(game===2){let a=eq();data={a,opts:choices(a.v,6),hit:null}}if(game===3){let cards=[],used=new Set(),usedExpressions=new Set(),tries=0;while(cards.length<6&&tries++<1000){let a=1+rand(level==='L2'?10:30),b=1+rand(level==='L2'?10:9),v=a*b;if(op==='div'||op==='mix'&&level==='L2'){v=1+rand(10);a=v;b=1+rand(10)}if(used.has(v))continue;let factors=[];for(let k=1;k<=Math.min(v,level==='L2'?10:99);k++){if(v%k===0&&v/k<=(level==='L2'?10:99))factors.push([k,v/k])}let expressions=[];if(op!=='div'){for(const [x,y] of factors){if(level==='L2'&&(x>10||y>10))continue;expressions.push(`${x} × ${y}`)}}if(op!=='mul'){for(let k=1;k<=(level==='L2'?10:9);k++){let dividend=v*k;if(dividend>(level==='L2'?100:999))continue;expressions.push(`${dividend} ÷ ${k}`)}}expressions=[...new Set(expressions)].filter(s=>!usedExpressions.has(s));if(expressions.length<2)continue;let chosen=shuffle(expressions).slice(0,2);chosen.forEach(s=>{cards.push({s,v});usedExpressions.add(s)});used.add(v)}data={cards:shuffle(cards),sel:[],matched:[],pairs:0,pairFeedback:null}}if(game===4){let max=level==='L2'?10:12,a=2+rand(max-1),b=2+rand(max-1),slot=rand(3),v=[a*b,a,b][slot];data={a,b,slot,answer:v,opts:choices(v)}}if(game===5){let progress=data.progress||[0,0];data={q:eq(),progress,revealed:false};if(progress.some(v=>v>=raceGoal)){data.progress=[0,0]}}render()}function render(){const [icon,name,hint]=games[game];$('title').textContent=icon+' '+name;$('hint').textContent=hint;$('nav').innerHTML=games.map((g,i)=>`<button data-game="${i}" class="${i===game?'active':''}">${g[0]} ${g[1]}</button>`).join('');document.querySelectorAll('[data-op]').forEach(b=>b.classList.toggle('active',b.dataset.op===op));$('settings').style.visibility=game===5?'hidden':'visible';let h='';if(game===0){h=`<div class="equations"><div class="eq">${data.a.s}</div><div class="eq">${data.b.s}</div></div>${grid(['>','=','<'].map(v=>button(v,'answer',v,data.selected===v?(data.selectedGood?'correct-choice':'wrong-choice'):'')),3)}${locked?`<div class="hint" style="text-align:center">${data.a.v} ${data.answer} ${data.b.v}</div>`:''}`}if(game===1){h=`<div class="question">${data.s}</div>${grid(data.opts.map(v=>button(v,'answer',v,game===1&&data.selected===v?(data.selectedGood?'correct-choice':'wrong-choice'):'')))}`}if(game===2){h=`<div class="question">${data.a.s} = ?</div><div class="moles">${data.opts.map(v=>`<button class="mole ${data.hit===v?(v===data.a.v?'struck sunk':'bad'):''}" data-action="answer" data-value="${v}"><span class="face">🐹<small>${v}</small></span>${data.hit===v&&v===data.a.v?'<span class="hole-cover">🕳️</span>':''}</button>`).join('')}</div>`}if(game===3){h=`${grid(data.cards.map((c,i)=>button(data.matched.includes(i)?'⭐':c.s,'pair',i,data.matched.includes(i)?'correct-choice':data.pairFeedback?.includes(i)?(data.pairFeedbackGood?'correct-choice':'wrong-choice'):data.sel.includes(i)?'selected':'')),3)}<div class="hint" style="text-align:center">Matched ${data.pairs} / 3 pairs</div>`}if(game===4){let vals=[data.a*data.b,data.a,data.b];h=`<div class="pyramid"><div class="pyr-row"><div class="pyr ${data.slot===0?'blank':''} ${locked&&data.slot===0?'fill':''}">${data.slot===0?(locked?data.answer:'?'):vals[0]}</div></div><div class="pyr-row"><div class="pyr ${data.slot===1?'blank':''} ${locked&&data.slot===1?'fill':''}">${data.slot===1?(locked?data.answer:'?'):vals[1]}</div><div class="pyr ${data.slot===2?'blank':''} ${locked&&data.slot===2?'fill':''}">${data.slot===2?(locked?data.answer:'?'):vals[2]}</div></div></div>${grid(data.opts.map(v=>button(v,'answer',v)))}`}if(game===5){h=`<div class="race-layout"><div class="tracks">${['red','blue'].map((c,i)=>`<div class="lane ${c}"><div class="finish"></div><div class="lane-label">${c.toUpperCase()} · ${data.progress[i]}/${raceGoal}</div><div class="kart ${c}" style="bottom:${3+Math.min(data.progress[i]/raceGoal,1)*78}%"><div class="car-body"><div class="windshield"></div><div class="car-hood"></div><div class="wheel left"></div><div class="wheel right"></div><div class="light left"></div><div class="light right"></div></div></div></div>`).join('')}</div><div class="race-controls"><div class="race-length"><span>🏁 Race length</span><div class="race-length-options">${[5,10,15,20].map(n=>`<button type="button" class="${raceGoal===n?'chosen':''}" data-race-goal="${n}">${n}</button>`).join('')}</div></div><div class="hint" style="text-align:center">FIRST TEAM TO ANSWER WINS THE POINT</div><div class="question">${data.q.s} = ?</div><div class="hint" style="text-align:center">Teacher confirms the answer, then taps a team</div><div class="team-buttons"><button class="redbtn" data-action="race" data-value="0">🔴 Red +1</button><button class="bluebtn" data-action="race" data-value="1">🔵 Blue +1</button></div>${data.revealed?`<div class="revealed-answer">Answer: ${data.q.v}</div>`:`<button class="small" data-action="reveal">Show Answer 👀</button>`}</div></div>`} $('board').innerHTML=h;$('stats').textContent=game===5?`🏁 First to ${raceGoal} points`:game===3?`⭐ ${score} · Round ${round}`:`⭐ ${score} · Round ${round}`;$('next').textContent=game===5&&win?'New Race ↻':'Next ➜';$('feedback').textContent=feedback;$('feedback').className='feedback '+feedbackType}function answer(v){if(locked)return;let expected=game===0?data.answer:game===2?data.a.v:data.answer;let good=String(v)===String(expected);locked=true;if(game===0){data.selected=v;data.selectedGood=good}if(game===1){data.selected=Number(v);data.selectedGood=good}if(game===2){data.hit=Number(v);beep('bump');const mole=document.querySelector(`.mole[data-value="${v}"]`);if(mole){const hammer=document.createElement('span');hammer.className='hammer';hammer.textContent='🔨';mole.append(hammer);mole.classList.add('struck');} setTimeout(()=>{setFeedback(good?'BUMP! Correct! 🎉':`Oops! Answer: ${expected}`,good);if(good){score++;beep('good');successOverlay()}render()},520);return}if(good){score++;beep('good');successOverlay()}else beep('bad');setFeedback(good?'Correct! Awesome! ✨':`Try again next time! Answer: ${expected}`,good);render()}function pair(i){if(locked||data.matched.includes(i)||data.sel.includes(i))return;data.sel.push(i);if(data.sel.length===2){let [a,b]=data.sel;locked=true;render();setTimeout(()=>{let good=data.cards[a].v===data.cards[b].v;data.pairFeedback=[a,b];data.pairFeedbackGood=good;if(good){data.matched.push(a,b);data.pairs++;score++;beep('good');successOverlay();setFeedback('Perfect match! ✨',true)}else{beep('bad');setFeedback('Not a match — try again!',false)}data.sel=[];locked=data.pairs===3;if(locked){setFeedback('All pairs matched! 🎉',true)}render();setTimeout(()=>{if(game!==3||data.pairFeedback?.[0]!==a||data.pairFeedback?.[1]!==b)return;data.pairFeedback=null;render()},good?850:1100)},550)}else render()}function race(i){if(locked)return;data.progress[i]++;beep('good');if(data.progress[i]>=raceGoal){locked=true;win=true;setFeedback((i===0?'RED':'BLUE')+' TEAM WINS! 🏆',true);celebrate()}else{setFeedback((i===0?'Red':'Blue')+' team speeds ahead! 🏎️',true);data.q=eq();data.revealed=false}render()}document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.raceGoal!==undefined){raceGoal=Number(b.dataset.raceGoal);data={progress:[0,0]};round=0;locked=false;win=false;newRound();return}if(b.dataset.game!==undefined){game=+b.dataset.game;round=0;score=0;data={};newRound();return}if(b.dataset.op){op=b.dataset.op;round=0;score=0;data={};newRound();return}let action=b.dataset.action;if(action==='answer')answer(b.dataset.value);if(action==='pair')pair(+b.dataset.value);if(action==='race')race(+b.dataset.value);if(action==='reveal'&&game===5){data.revealed=true;render()} });$('next').onclick=()=>{if(game===5&&win)data={progress:[0,0]};newRound()};$('reset').onclick=()=>{score=0;round=0;data={};newRound()};document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('active',x.dataset.level===level));score=0;round=0;data={};newRound()});$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Sound On':'🔇 Sound Off';if(sound)beep('good')};newRound()})();
</script></body></html>
